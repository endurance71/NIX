<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <!-- Link previews (the share sheet, Messages) read these: Polish first, the script switches
         to English for other devices. The images live next to this file on the host. -->
    <title>NiX — prywatne zaproszenie</title>
    <meta name="description" content="Zainstaluj NiX i otwórz ten link ponownie, aby zobaczyć, kto Cię zaprosił." />
    <meta property="og:site_name" content="NiX" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NiX — prywatne zaproszenie" />
    <meta property="og:description" content="Zainstaluj NiX i otwórz ten link ponownie, aby zobaczyć, kto Cię zaprosił." />
    <meta property="og:image" content="https://nix.damianmotylinski.pl/nix-share-image.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/png" sizes="180x180" href="/nix-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/nix-touch-icon.png" />
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fff; }
      main { width: min(420px, calc(100% - 40px)); text-align: center; }
      .mark { width: 92px; height: 92px; margin: 0 auto; border-radius: 22px; display: grid; place-items: center; background: #fff; color: #000; font-size: 27px; font-weight: 800; letter-spacing: -1px; }
      h1 { margin: 24px 0 10px; font-size: 30px; }
      p { color: #b8b8bd; font-size: 17px; line-height: 1.45; }
      a { display: block; margin-top: 28px; padding: 14px 18px; border-radius: 14px; background: #fff; color: #000; text-decoration: none; font-weight: 700; }
      small { display: block; margin-top: 18px; color: #77777d; line-height: 1.4; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-label="NiX">NiX</div>
      <h1 data-i18n="title">Prywatne zaproszenie NiX</h1>
      <p data-i18n="body">Zainstaluj NiX, a następnie ponownie otwórz ten link, aby bezpiecznie zobaczyć, kto Cię zaprosił.</p>
      <a id="store-link" href="https://apps.apple.com/app/id6791332379" data-i18n="action">Otwórz App Store</a>
      <small data-i18n="privacy">Ta strona nie ujawnia osoby zapraszającej i nie zapisuje tokenu zaproszenia.</small>
      <small><a href="/privacy/" data-i18n="privacyLink">Polityka prywatności</a> · <a href="/terms/" data-i18n="termsLink">Regulamin</a></small>
    </main>
    <script>
      // The invite token stays in the URL handled by the browser/OS. This
      // landing never reads, copies or persists it.
      const copy = {
        en: {
          pageTitle: 'NiX — private invitation',
          description: 'Install NiX and open this link again to see who invited you.',
          title: 'Private NiX invitation',
          body: 'Install NiX, then open this invitation link again to securely preview who invited you.',
          action: 'Open App Store',
          privacy: 'This page does not reveal the inviter and does not store the invitation token.',
          privacyLink: 'Privacy Policy',
          termsLink: 'Terms'
        }
      };
      if (!(navigator.language || '').toLowerCase().startsWith('pl')) {
        document.documentElement.lang = 'en';
        document.title = copy.en.pageTitle;
        document.querySelector('meta[property="og:title"]').setAttribute('content', copy.en.pageTitle);
        document.querySelectorAll('meta[name="description"], meta[property="og:description"]').forEach((node) => {
          node.setAttribute('content', copy.en.description);
        });
        document.querySelectorAll('[data-i18n]').forEach((node) => {
          node.textContent = copy.en[node.dataset.i18n];
        });
      }
    </script>
  </body>
</html>
