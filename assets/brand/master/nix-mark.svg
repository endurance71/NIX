<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- NiX mark, the source of truth: the logo drawn in the app (src/components/brand/DrawnLogo.tsx).
       An N whose right leg is an X on a 1024 grid, one 100 px stroke with round caps, flat ink, no
       shadow. The rising stroke is glass: the same ink at 55 -> 92 % opacity, under the other two. -->
  <defs>
    <linearGradient id="rise" x1="272" y1="752" x2="752" y2="272" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-width="100" stroke-linecap="round" stroke-linejoin="round">
    <path d="M272 752 L752 272" stroke="url(#rise)"/>
    <path d="M272 752 L272 272 L512 512" stroke="#FFFFFF"/>
    <path d="M388 388 L752 752" stroke="#FFFFFF"/>
  </g>
</svg>
