<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <!-- Link preview (og:image) for nix.shipapp.pl: rendered square, the middle 1200x630 band is kept.
       The app icon tile (nix-icon.svg) on the brand gradient with its glow. No text: the page title
       comes with the link. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="285" x2="1200" y2="915" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14123A"/>
      <stop offset="0.55" stop-color="#2A1A9E"/>
      <stop offset="1" stop-color="#4B4DF0"/>
    </linearGradient>
    <radialGradient id="glow" cx="600" cy="600" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7F8CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7F8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="440" y1="440" x2="760" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7F8CFF"/>
      <stop offset="0.5" stop-color="#4B4DF0"/>
      <stop offset="1" stop-color="#2A1A9E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="600" cy="600" r="420" fill="url(#glow)"/>
  <rect x="440" y="440" width="320" height="320" rx="72" fill="url(#tile)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
  <g transform="translate(440 440) scale(0.3125)" fill="none" stroke-width="100" stroke-linecap="round" stroke-linejoin="round">
    <path d="M272 752 L752 272" stroke="#FFFFFF" stroke-opacity="0.75"/>
    <path d="M272 752 L272 272 L512 512" stroke="#FFFFFF"/>
    <path d="M388 388 L752 752" stroke="#FFFFFF"/>
  </g>
</svg>
