<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- NiX "Szkło" mark on a transparent background (dark/tinted icon, splash). Mark: an N whose right leg is an X; one 100 px stroke, round caps.
       The PNG exports in ../app and ../splash are rendered from the same geometry. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7F8CFF"/>
      <stop offset="0.5" stop-color="#4B4DF0"/>
      <stop offset="1" stop-color="#2A1A9E"/>
    </linearGradient>
    <radialGradient id="glow" cx="300" cy="160" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rise" x1="272" y1="752" x2="752" y2="272" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="stem" x1="272" y1="272" x2="272" y2="752" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEEFF"/>
    </linearGradient>
    <linearGradient id="fall" x1="388" y1="388" x2="752" y2="752" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F4FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#0A0640" flood-opacity="0.32"/>
    </filter>
  </defs>


  <g fill="none" stroke-width="100" stroke-linecap="round" stroke-linejoin="round">
    <path d="M272 752 L752 272" stroke="url(#rise)"/>
    <path d="M272 752 L272 272 L512 512" stroke="url(#stem)" filter="url(#shadow)"/>
    <path d="M388 388 L752 752" stroke="url(#fall)" filter="url(#shadow)"/>
  </g>
</svg>
