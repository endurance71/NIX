# Idle/live moderation worker. Secrets stay outside Git.
# NIX_MODERATION_ENV_FILE must point at a mode-600 env file with:
# AZURE_CONTENT_SAFETY_ENDPOINT, AZURE_CONTENT_SAFETY_KEY,
# SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, MODERATION_EXTERNAL_USED
#
# Do not publish ports. Do not set network_mode: none (needs Azure + PostgREST egress).
# Do not set MODERATION_WORKER_ONCE on a hosted daemon.

services:
  moderation-worker:
    build:
      context: ../..
      dockerfile: workers/moderation/Dockerfile
    image: nix-moderation-worker:${NIX_MODERATION_IMAGE_TAG:-local}
    container_name: nix-moderation-worker
    restart: unless-stopped
    env_file:
      - ${NIX_MODERATION_ENV_FILE:?set NIX_MODERATION_ENV_FILE}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    cpus: "1.0"
    mem_limit: 1g
    memswap_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
